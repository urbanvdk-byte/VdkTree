name: VdkTree authentication checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python
        run: python -m compileall -q app.py auth_backend.py tests
      - name: Check JavaScript syntax
        run: node --check auth/client.js
      - name: Test MAX and credential authentication
        run: python -m pytest -q
