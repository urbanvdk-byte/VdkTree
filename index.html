<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VdkTree — деревья Владивостока</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxT5A6XoF8r5hZpE9QfXz7L8A=" crossorigin=""><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;color:#20352a;background:#f5f8f4}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:white;box-shadow:0 2px 12px #0001;position:relative;z-index:1001}h1{font-size:20px;margin:0}.version{font-size:12px;color:#47765b;background:#e6f3e7;padding:6px 10px;border-radius:20px}#map{height:calc(100dvh - 66px)}.toolbar{position:absolute;z-index:1000;top:82px;left:16px;right:16px;display:flex;gap:8px;max-width:520px}.toolbar select,.toolbar button{background:white;border:1px solid #d8e3d8;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001}.toolbar select{flex:1}.add{position:absolute;z-index:1000;bottom:24px;left:50%;transform:translateX(-50%);background:#17743c;color:white;border:0;border-radius:24px;padding:16px 24px;font-weight:700;white-space:nowrap;box-shadow:0 4px 18px #0003}dialog{border:0;border-radius:18px;padding:22px;width:min(94vw,440px);max-height:90dvh;overflow:auto;box-shadow:0 12px 50px #0004}dialog::backdrop{background:#0008}form{display:grid;gap:11px}input,select,textarea{width:100%;padding:11px;border:1px solid #cdd8cd;border-radius:9px;font:inherit}label{font-weight:600;font-size:13px}form button,.close{border:0;border-radius:10px;padding:13px;background:#17743c;color:white;font-weight:700;cursor:pointer}.close{background:#e9eee9;color:#20352a}.tip{font-size:12px;color:#657369}.marker{border-radius:50%;border:3px solid white;width:19px;height:19px;box-shadow:0 1px 5px #3338}.popup img{max-width:220px;max-height:160px;border-radius:8px}.popup{min-width:170px}.popup p{margin:5px 0}@media(max-width:600px){header{padding:0 12px}h1{font-size:17px}.toolbar{left:10px;right:10px}}
</style></head><body><header><h1>🌳 Деревья Владивостока</h1><span class="version">v0.1.0</span></header><div id="map"></div><div class="toolbar"><select id="filter" aria-label="Фильтр"><option value="all">Все деревья</option><option value="healthy">🟢 Здоровые</option><option value="damaged">🟠 Повреждённые</option><option value="dead">🔴 Погибшие</option></select><button id="locate">📍 Я здесь</button></div><button class="add" id="add">＋ Добавить дерево</button><dialog id="dlg"><form id="treeform"><h2 style="margin:0">Новое дерево</h2><p class="tip">Укажите точку на карте. Перед добавлением проверьте соседние деревья.</p><label>Широта<input name="lat" id="lat" type="number" step="any" required></label><label>Долгота<input name="lon" id="lon" type="number" step="any" required></label><label>Порода<input name="species" maxlength="80" placeholder="Например, дуб монгольский" required></label><label>Состояние<select name="condition"><option value="healthy">Здоровое</option><option value="damaged">Повреждено</option><option value="dead">Погибло</option></select></label><label>Высота, м<input name="height" type="number" min="0.1" max="100" step="0.1"></label><label>Диаметр ствола, см<input name="diameter" type="number" min="0.1" max="1000" step="0.1"></label><label>Фото (JPG/PNG/WebP, до 5 МБ)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Комментарий<textarea name="comment" maxlength="1000" rows="3"></textarea></label><button type="submit" id="save">Сохранить дерево</button><button type="button" class="close" id="cancel">Отмена</button><p id="message" role="status"></p></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([43.1155,131.8855],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const dlg=document.getElementById('dlg'),form=document.getElementById('treeform'),filter=document.getElementById('filter');let rows=[],layer=L.layerGroup().addTo(map),chosen=null;const colors={healthy:'#218e48',damaged:'#ef8e1b',dead:'#ce4242'};const names={healthy:'Здоровое',damaged:'Повреждено',dead:'Погибло'};function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){layer.clearLayers();for(const t of rows){if(filter.value!=='all'&&filter.value!==t.condition)continue;const m=L.circleMarker([t.lat,t.lon],{radius:8,color:'white',weight:2,fillColor:colors[t.condition],fillOpacity:1}).addTo(layer);const div=document.createElement('div');div.className='popup';div.innerHTML='<b>'+escapeHTML(t.species)+'</b><p>'+escapeHTML(names[t.condition])+'</p>'+(t.height?'<p>Высота: '+escapeHTML(t.height)+' м</p>':'')+(t.diameter?'<p>Диаметр: '+escapeHTML(t.diameter)+' см</p>':'')+(t.comment?'<p>'+escapeHTML(t.comment)+'</p>':'')+(t.photo?'<img alt="Фото дерева" src="'+encodeURI(t.photo)+'">':'');m.bindPopup(div);}}async function load(){try{const b=map.getBounds(),r=await fetch('/api/trees?min_lat='+b.getSouth()+'&max_lat='+b.getNorth()+'&min_lon='+b.getWest()+'&max_lon='+b.getEast());if(!r.ok)throw Error('Ошибка сервера');rows=await r.json();render();}catch(e){alert('Не удалось загрузить деревья: '+e.message)}}map.on('moveend',load);filter.addEventListener('change',render);function openForm(p){chosen=p;form.reset();document.getElementById('lat').value=p.lat.toFixed(6);document.getElementById('lon').value=p.lng.toFixed(6);document.getElementById('message').textContent='';dlg.showModal()}document.getElementById('add').onclick=()=>openForm(map.getCenter());map.on('click',e=>openForm(e.latlng));document.getElementById('cancel').onclick=()=>dlg.close();document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:17});map.on('locationerror',()=>alert('Геолокация недоступна. Разрешите доступ к местоположению и используйте HTTPS.'));form.onsubmit=async e=>{e.preventDefault();const save=document.getElementById('save');save.disabled=true;const msg=document.getElementById('message');try{const data=new FormData(form);if(!data.get('photo')?.size)data.delete('photo');const r=await fetch('/api/trees',{method:'POST',body:data});if(!r.ok){const err=await r.json();throw Error(typeof err.detail==='string'?err.detail:'Ошибка сохранения')}dlg.close();await load()}catch(err){msg.textContent=err.message}finally{save.disabled=false}};load();
</script></body></html>
